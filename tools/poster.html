<!doctype html>
<!--
  Poster rig. Renders a specimen through the site's own viewer so the static
  plate and the live model share one material, one light rig, and one set of
  edge lines. Driven by tools/make-posters.mjs; not part of the shipped site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>poster rig</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  #rig { width: 100vw; height: 100vh; position: relative; }
  .viewer__poster, .viewer__state, .viewer__readout { display: none !important; }
  canvas { width: 100%; height: 100%; }
</style>
<script src="../assets/js/finishes.js"></script>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/" } }
</script>
</head>
<body>
<div id="rig"></div>
<script type="module">
import { mountViewer } from '../assets/js/viewer.js';

const q = new URLSearchParams(location.search);
const rig = document.getElementById('rig');
rig.className = 'viewer';
rig.dataset.model = q.get('model');
rig.dataset.spin = 'off';
rig.dataset.finish = q.get('finish') || 'natural';
rig.dataset.fit = q.get('fit') || '1.12';
rig.innerHTML = '<canvas class="viewer__canvas"></canvas>';

const v = mountViewer(rig);
window.__v = v;

// The rig is ready once the mesh is in and one frame has settled.
const done = () => new Promise((res) => {
  const check = () => {
    if (rig.classList.contains('is-live')) {
      requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(res, 260)));
    } else if (rig.classList.contains('is-failed')) {
      res();
    } else {
      setTimeout(check, 60);
    }
  };
  check();
});

done().then(() => { window.__ready = true; });
</script>
</body>
</html>
